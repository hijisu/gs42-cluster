<style>
/* 레이아웃: 상단 화면 선택 + 변경점 요약 + 실제 앱 토큰을 쓴 목업 프레임. 현재 frontend의 tokens.css/components.css를 그대로 옮김 */
:root{
  --c-ink:#121212;--c-ink-hover:#333;--c-teal:#00BABC;--c-teal-dark:#00797B;--c-teal-deeper:#005A5C;--c-teal-soft:#D5F2F2;--c-teal-text:#00585A;
  --c-bg:#F2F2EE;--c-surface:#fff;--c-line:#DADAD4;--c-line-soft:#EDEDE8;--c-line-input:#C8C8C2;--c-muted:#5C5C58;--c-body-soft:#3F3F3B;--c-disabled:#B5B5AF;
  --c-warn-bg:#FBE7D7;--c-warn-stripe:#F6D3B8;--c-warn-text:#9A3412;--c-warn-line:#C2410C;--c-scrim:rgba(18,18,18,.55);
  --font-sans:'IBM Plex Sans KR',system-ui,sans-serif;--font-mono:'JetBrains Mono',ui-monospace,monospace;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-7:28px;--sp-8:40px;
  --r-sm:8px;--r-md:10px;--r-lg:16px;--r-xl:18px;--r-pill:999px;--touch:44px;

}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:#E4E4DE;color:var(--c-ink);font-family:var(--font-sans);font-size:15px;line-height:1.5;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p{margin:0}
button{font-family:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 56px;display:flex;flex-direction:column;gap:16px}
.top h1{font-size:20px}
.top p{color:var(--c-muted);font-size:13px;margin-top:2px}
.picker{display:flex;flex-direction:column;gap:8px}
.picker .grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.picker .grp>b{font-family:var(--font-mono);font-size:12px;color:var(--c-muted);min-width:64px}
.pk{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--c-line-input);background:#fff;font-size:14px;cursor:pointer;color:var(--c-ink)}
.pk[aria-pressed=true]{background:var(--c-ink);color:#fff;border-color:var(--c-ink)}
.changes{background:var(--note-bg);border:1px solid var(--note-line);border-radius:12px;padding:12px 16px;color:var(--note-text);font-size:14px}
.changes b{display:block;font-family:var(--font-mono);font-size:12px;letter-spacing:.04em;margin-bottom:4px}
.changes ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px}
.frame{background:var(--c-bg);border-radius:14px;border:1px solid var(--c-line);overflow:hidden}
.frame-bar{background:#fff;border-bottom:1px solid var(--c-line);padding:8px 16px;font-family:var(--font-mono);font-size:12px;color:var(--c-muted);display:flex;gap:8px;align-items:center}
.frame-bar i{width:8px;height:8px;border-radius:50%;background:var(--c-line);display:inline-block}
.main{padding:32px 36px 48px;display:flex;flex-direction:column;gap:var(--sp-7)}
/* app components */
.label{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--c-muted)}
.muted{color:var(--c-muted)}.small{font-size:13px}.mono{font-family:var(--font-mono)}
.h1{font-size:30px;font-weight:700;letter-spacing:-.01em;margin-top:8px}.sub{color:var(--c-muted);margin-top:6px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--sp-6);flex-wrap:wrap}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}.col{display:flex;flex-direction:column;gap:var(--sp-5);min-width:0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-5)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-5)}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-4)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:var(--sp-6);align-items:stretch}
.card{background:#fff;border:1px solid var(--c-line);border-radius:var(--r-lg);padding:var(--sp-6)}
.card-title{font-size:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--touch);padding:0 20px;border-radius:var(--r-md);border:1px solid var(--c-ink);background:var(--c-ink);color:#fff;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--c-ink-hover)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--c-ink)}.btn.ghost:hover{background:var(--c-line-soft)}
.btn.teal{background:var(--c-teal);border-color:var(--c-teal);color:var(--c-ink)}
.btn.warn{background:#fff;border-color:var(--c-warn-line);color:var(--c-warn-text)}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px}
.pill{display:inline-flex;align-items:center;padding:3px 12px 3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--c-teal-soft);color:var(--c-teal-text)}.pill.wait{background:var(--c-warn-bg);color:var(--c-warn-text)}.pill.neu{background:var(--c-line-soft);color:var(--c-body-soft)}.pill.done{background:var(--c-ink);color:#fff}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--c-line-input);background:#fff;font:inherit;font-size:14px;cursor:pointer;color:var(--c-ink)}
.chip[aria-pressed=true]{background:var(--c-ink);border-color:var(--c-ink);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field label{font-size:13px;font-weight:600}.field .hint{font-size:12px;color:var(--c-muted)}
.input{min-height:var(--touch);border:1px solid var(--c-line-input);border-radius:var(--r-md);padding:0 14px;font:inherit;background:#fff;width:100%;color:var(--c-ink);min-width:0}
textarea.input{padding:12px 14px;min-height:80px;resize:vertical}
table.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;font-family:var(--font-mono);font-size:12px;font-weight:500;color:var(--c-muted);padding:10px 12px;border-bottom:1px solid var(--c-line)}
.table td{padding:14px 12px;border-bottom:1px solid var(--c-line-soft)}
.table tr.click{cursor:pointer}.table tr.click:hover td{background:var(--c-bg)}
.table td .link{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--c-teal-dark);cursor:pointer;text-align:left}
.table td .link:hover{text-decoration:underline}
.table-wrap{overflow-x:auto}
.scrim{position:absolute;inset:0;background:var(--c-scrim);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;z-index:10;overflow-y:auto}
.modal{background:#fff;border-radius:var(--r-xl);width:480px;max-width:100%;padding:var(--sp-7);display:flex;flex-direction:column;gap:var(--sp-4)}
.modal.wide{width:600px}
.modal-title{font-size:20px;font-weight:700}.modal-actions{display:flex;justify-content:flex-end;gap:8px}
.info{padding:14px 16px;border-radius:12px;background:var(--c-bg);font-size:14px;display:flex;flex-direction:column;gap:6px}
.list{display:flex;flex-direction:column}.list>div{padding:14px 0;border-bottom:1px solid var(--c-line-soft)}.list>div:last-child{border-bottom:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal span{font-size:12px;color:var(--c-muted);padding:4px 0}
.cal button{min-height:40px;border-radius:8px;border:0;background:transparent;font:inherit;font-size:14px;cursor:pointer;color:var(--c-ink)}
.cal button:hover{background:var(--c-line-soft)}.cal button.today{box-shadow:inset 0 0 0 1px var(--c-ink)}.cal button.sel{background:var(--c-ink);color:#fff}
.tl-row{display:grid;grid-template-columns:150px minmax(0,1fr)}.tl-body{border-top:1px solid var(--c-line-soft)}
.tl-name{padding:12px 0;display:flex;flex-direction:column}
.tl-cells{display:grid;grid-template-columns:repeat(13,1fr);padding:10px 0;min-height:44px}
.tl-cell{border-left:1px dashed var(--c-line)}.tl-cell.approved{background:var(--c-ink)}
.tl-cell.pending{background:repeating-linear-gradient(135deg,var(--c-warn-bg) 0 6px,var(--c-warn-stripe) 6px 12px)}
.tl-scroll{overflow-x:auto}.timeline{min-width:680px}
/* 면담 가능 시간 */
.av-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.av-nav{display:flex;align-items:center;gap:4px}.av-title{font-weight:700;min-width:120px;text-align:center}
.av-grid{display:grid;grid-template-columns:44px repeat(5,minmax(0,1fr));gap:2px;row-gap:2px;user-select:none}
.av-head{font-size:13px;text-align:center;padding:6px 0;display:flex;flex-direction:column;border-radius:8px}
.av-head.today{color:var(--c-teal-dark);font-weight:700}
.av-head.today span{display:inline-block;align-self:center;background:var(--c-teal-soft);border-radius:999px;padding:0 10px}
.av-time{font-family:var(--font-mono);font-size:12px;color:var(--c-muted);text-align:right;padding-right:6px;line-height:1}
.av-cell{min-height:28px;border:0;border-radius:8px;background:var(--c-line-soft);cursor:pointer}
.av-cell:hover{background:var(--c-line)}.av-cell.on{background:var(--c-teal)}
.av-sep{grid-column:1/-1;height:1px;background:var(--c-line-input);margin:6px 0}
.av-cell{position:relative}
.av-cell[data-tip]:hover::after,.av-cell[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);background:var(--c-ink);color:#fff;font-size:12px;line-height:1;padding:6px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:5}
.av-grid .av-cell{touch-action:none}
.av-cell.past{background:var(--c-line);cursor:not-allowed;display:block}
.av-head.pastcol{color:var(--c-disabled)}
.av-status{min-height:22px;font-size:13px;color:var(--c-warn-text)}
/* 면담 신청 슬롯 */
.slot-grid{display:grid;gap:8px}
.slot-head{text-align:center}.slot-time{font-size:13px;display:flex;align-items:center}
.slot-off{min-height:var(--touch);border-radius:var(--r-md);background:var(--c-line-soft);color:var(--c-disabled);display:flex;align-items:center;justify-content:center;font-size:13px}
.chip.slot-btn{justify-content:center;border-radius:var(--r-md);min-height:var(--touch)}
/* 도서 */
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px}
.book-card{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.book-cover{aspect-ratio:3/4;border-radius:8px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;overflow:hidden}
.book-title{font-weight:600;font-size:14px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;min-width:0}
.search-bar{display:flex;gap:10px}.search-bar .input{flex-grow:1}
.notice{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:16px 20px;border-radius:14px;background:var(--c-ink);color:var(--c-bg);flex-wrap:wrap}
.shortcut{display:flex;flex-direction:column;gap:18px;min-height:140px}
.summary-big{font-size:22px;font-weight:700}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px}
.legend{display:flex;gap:18px;font-size:13px;flex-wrap:wrap}
.pill-x{margin-left:6px;border:0;background:none;padding:0;font:inherit;cursor:pointer;color:inherit}
.review{display:flex;flex-direction:column;gap:10px}
.dots{display:inline-flex;gap:4px}.dots span{width:8px;height:8px;border-radius:50%;background:var(--c-line)}.dots span.on{background:var(--c-ink)}
.sortbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sortbar select{min-height:36px;width:auto;padding:0 12px;font-size:14px}
.crumb{border:0;background:none;padding:0;font:inherit;color:var(--c-teal-dark);cursor:pointer;min-height:36px}
.crumb:hover{text-decoration:underline}
.rel{position:relative;min-height:560px}
.g2>.card,.g3>.card,.g4>.card,.r21>.card,.r21>section{height:100%}
@media (max-width:900px){.g2>.card,.r21>.card,.r21>section{height:auto}.pend-wrap{min-height:0}.pend-wrap .pend-scroll{position:static;max-height:340px}}
.r21{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:var(--sp-5);align-items:stretch}
.pend-wrap{position:relative;flex:1 1 auto;min-height:260px}
.pend-wrap .pend-scroll{position:absolute;inset:0;max-height:none}
.pend-scroll{display:flex;flex-direction:column;max-height:340px;overflow-y:auto;border-top:1px solid var(--c-line-soft);margin:0 -4px;padding:0 4px}
.pend-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--c-line-soft)}
.pend-item:last-child{border-bottom:0}
@media (max-width:900px){
  .main{padding:20px 16px 40px;gap:20px}.h1{font-size:24px}
  .split,.g2,.g3,.g4,.r21{grid-template-columns:minmax(0,1fr)}
  .card{padding:16px}
}
@media (max-width:600px){
  .table thead{display:none}.table,.table tbody,.table tr,.table td{display:block;width:100%}
  .table tr{padding:12px 0;border-bottom:1px solid var(--c-line-soft)}
  .table td{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border:0;text-align:right}
  .table td::before{content:attr(data-label);color:var(--c-muted);font-family:var(--font-mono);font-size:12px;text-align:left}
  .table td[data-label=""]{justify-content:flex-end}.table td[data-label=""]::before{display:none}
}

    <h1>gs42 3차 수정 시안</h1>
    <p>1차 시안과 같은 방식입니다. 이번에는 ‘한 화면에 다 보이는지’와 ‘버튼 통일’을 먼저 정하고, 화면은 실제 크기(1440×900 브라우저 기준)로 축소해 보여줍니다.</p>

<script>
const $=(s,r=document)=>r.querySelector(s);const esc=(s)=>String(s).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  <table class="table"><thead><tr><th>교육과정명</th><th>교육기간</th><th>교육장소</th><th style="text-align:right">후기 수</th></tr></thead><tbody>${RC.map(x=>`<tr class="click" data-course="${x.id}"><td><button class="link">${x.name}</button></td><td class="mono">${x.p}</td><td>${x.loc}</td><td class="mono" style="text-align:right">${x.n}</td></tr>`).join('')}</tbody></table></div></div>`}
 const x=RC.find(r=>r.id===c);const rs=c===2?RV:[];const open=m!=null?RV[m]:null;
 const body=(r)=>`${r[2]?`<p class="body-sm"><b>좋았던 점</b> ${esc(r[2])}</p>`:''}${r[3]?`<p class="muted body-sm"><b>아쉬운 점</b> ${esc(r[3])}</p>`:''}${r[4]?`<p class="muted body-sm"><b>추천 대상</b> ${esc(r[4])}</p>`:''}${r[5].length?`<div class="chips" style="gap:6px">${r[5].map(t=>`<span class="pill neu">#${t}</span>`).join('')}</div>`:''}`;
 const mo=open?(open[6]?modal('내 후기 수정',`<div class="field"><label>좋았던 점</label><textarea class="input" style="min-height:72px">${esc(open[2])}</textarea></div><div class="field"><label>아쉬운 점</label><textarea class="input" style="min-height:72px">${esc(open[3])}</textarea></div><div class="field"><label>추천 대상</label><input class="input" value="${esc(open[4])}"></div>`,'<button class="btn ghost" data-close>취소</button><button class="btn" data-close>저장</button>'):modal(`${open[0]} · 만족도 ${open[1]}/5`,`${body(open)}<span class="muted small mono">${open[7]}</span>`,'<button class="btn ghost" data-close>닫기</button>')):'';
 return `${side(false,4)}<div class="main" style="position:relative">${H('04 · COURSE REVIEWS',x.name,'','<button class="crumb" data-back>← 교육과정 목록</button>')}
 <div class="split" style="align-items:start"><div class="col" style="gap:12px">
  <div class="card row"><span class="stack" style="gap:2px"><span class="label">${x.name}</span><span class="muted small">${x.p} · ${x.loc}</span></span><span style="display:flex;gap:24px"><span><span class="mono stat" style="font-size:20px;font-weight:700">4.2</span><br><span class="muted" style="font-size:12px">평균 만족도</span></span><span><span class="mono stat" style="font-size:20px;font-weight:700">${x.n}</span><br><span class="muted" style="font-size:12px">후기 수</span></span></span></div>
  ${rs.length===0?'<div class="card"><p class="muted">아직 등록된 후기가 없어요.</p></div>':`<div class="g2" style="gap:12px">${rs.map((r,i)=>`<article class="card stack rvc" style="gap:8px;cursor:pointer" data-rv="${i}"><div class="row"><span style="display:flex;gap:6px;align-items:center"><b class="mono small">${r[6]?'내 후기':r[0]}</b></span>${dots(r[1])}</div><p class="body-sm clamp1"><b>좋았던 점</b> ${esc(r[2])}</p><div class="row"><span class="muted small mono">${r[7]}</span>${r[6]?'<button class="btn ghost sm" data-rv="'+i+'">수정</button>':''}</div></article>`).join('')}</div>`}
 </div><div class="col" style="gap:12px">
  <div class="card stack" style="gap:8px"><h2 class="card-title">후기 작성</h2><div class="field"><label>과정</label><select class="input"><option>${x.name}</option></select></div><div class="field"><label>만족도</label>${dots(0)}</div><div class="field"><label>좋았던 점</label><textarea class="input" style="min-height:56px"></textarea></div><div class="field"><label>아쉬운 점</label><textarea class="input" style="min-height:56px"></textarea></div><label class="check small"><input type="checkbox"> 익명으로 등록</label><button class="btn">후기 등록</button></div>
  <div class="card stack" style="gap:4px"><h2 class="card-title">내가 참여한 과정</h2><div class="list"><div class="row" style="padding:8px 0"><span class="small">서울대학교 파이썬 AI 교육</span><span class="pill wait">작성 대기</span></div><div class="row" style="padding:8px 0"><span class="small">경북 특화형 데이터센터 기초과정</span><span class="pill ok">작성 완료</span></div></div></div>
 </div></div>${mo}</div>`}

function sMeeting(){const tab=st.tab??'av';const times=[];for(let h=9;h<18;h++){times.push(String(h).padStart(2,'0')+':00',String(h).padStart(2,'0')+':30')}
 const on=(t)=>{const h=+t.slice(0,2)+(t.endsWith('30')?.5:0);return (h>=10&&h<12)||(h>=13&&h<17)};const dn=['월','화','수','목','금'];
 const grid=`<div class="av-grid" style="grid-template-columns:40px repeat(5,minmax(0,1fr))"><span></span>${dn.map((n,i)=>`<span class="av-head ${i===2?'today':''}" style="font-size:12px"><span>10/${12+i} (${n})</span></span>`).join('')}${times.map(t=>`${t.endsWith(':00')&&t!=='09:00'?'<div class="av-sep" style="margin:3px 0"></div>':''}<span class="av-time">${t.endsWith(':00')?t:''}</span>${dn.map((_,i)=>`<span class="av-cell ${on(t)?'on':''}"></span>`).join('')}`).join('')}</div>`;
 const types=[['진로 상담','김하나'],['학습 상담','이둘'],['생활 상담','미지정'],['타 사업 참여','박셋']];
 const def=`<div class="list">${types.map(t=>`<div class="row" style="padding:10px 0"><label class="small">${t[0]}</label><select class="input" style="width:160px;min-height:32px;font-size:13px"><option>${t[1]}</option></select></div>`).join('')}</div>`;
 return `${side(true,1)}<div class="main">
 ${H('01 · MEETING ADMIN','면담 관리','신청한 대면 면담을 확인하고 담당자와 일정을 확정하세요.')}
 <div class="tabs" role="tablist"><button aria-selected="true">배정 중 3</button><button aria-selected="false">시간 조율 중 1</button><button aria-selected="false">확정</button><button aria-selected="false">지난 면담</button></div>
 <div class="split" style="align-items:stretch"><div class="col" style="gap:10px">
  ${[['이서준','진로 상담','10/21 (수) 10:00'],['박하은','학습 상담','10/22 (목) 14:00'],['최유진','타 사업 참여','10/23 (금) 11:00']].map(r=>`<div class="card stack" style="gap:6px"><div class="row"><span><b>${r[0]}</b> <span class="small muted">· ${r[1]}</span></span><span class="pill wait">배정 중</span></div><div class="mono small">${r[2]}</div><div style="display:flex;gap:6px"><button class="btn sm">확정</button><button class="btn ghost sm">다른 시간 제안</button><button class="btn danger sm">반려</button></div></div>`).join('')}
 </div><div class="card stack" style="gap:10px"><div class="row"><div class="tabs" role="tablist" style="padding:2px"><button data-tab="av" aria-selected="${tab==='av'}">내 면담 가능 시간</button><button data-tab="df" aria-selected="${tab==='df'}">유형별 기본 담당자</button></div><div style="display:flex;gap:6px"><button class="btn ghost sm" ${tab==='av'?'':'disabled'}>변경 취소</button><button class="btn sm">저장</button></div></div>${tab==='av'?`<div class="row"><div style="display:flex;gap:4px;align-items:center"><button class="btn ghost sm">‹</button><b class="small">10/12 ~ 10/16</b><button class="btn ghost sm">›</button><button class="btn ghost sm">오늘</button></div><span class="small muted">끌어서 열고 닫아요</span></div>${grid}`:def}</div></div></div>`}

function sCourse(){const cs=[['서울대학교 파이썬 AI 교육','08/18–08/27',24,62,'종료','neu'],['경북 특화형 데이터센터 기초과정','10/14–10/23',18,0,'진행 중','ok'],['글로벌 기업가 정신 및 AI 몰입 프로그램','07/19–07/28',30,91,'후기 수집 중','wait']];
 const m=st.m==='create'?modal('새 교육과정 등록',`<div class="field"><label>과정명</label><input class="input" placeholder="예: 2026 경북 특화형 데이터센터 기초과정"></div><div class="g2" style="gap:10px"><div class="field"><label>시작일</label><input class="input" type="date" value="2026-10-14"></div><div class="field"><label>종료일</label><input class="input" type="date" value="2026-10-23"></div></div><div class="field"><label>참여 학생</label><div style="display:flex;gap:8px"><input class="input" style="flex:1" placeholder="intra ID 입력 후 Enter"><button class="btn ghost">추가</button><button class="btn ghost">CSV</button></div><div class="chips"><span class="pill neu">kimsh ×</span><span class="pill neu">leejw ×</span></div></div>`,'<button class="btn ghost" data-close>취소</button><button class="btn" data-close>과정 등록</button>'):'';
 return `${side(true,4)}<div class="main" style="position:relative">
 ${H('04 · COURSE ADMIN','교육과정 · 후기 관리','과정을 등록하고 참여 학생을 추가하면 후기 게시판이 열려요.','<button class="btn" data-open="create">+ 교육과정 등록</button>')}
 <div class="card stack" style="gap:6px"><h2 class="card-title">교육과정</h2><table class="table"><thead><tr><th>과정명</th><th>기간</th><th>참여</th><th>후기 작성률</th><th>상태</th><th></th></tr></thead><tbody>${cs.map(c=>`<tr><td><b>${c[0]}</b></td><td class="mono">${c[1]}</td><td class="mono">${c[2]}명</td><td class="mono small">${c[3]}%</td><td><span class="pill ${c[5]}">${c[4]}</span></td><td style="white-space:nowrap;text-align:right"><button class="btn ghost sm">수정</button> <button class="btn ghost sm">후기 요청</button></td></tr>`).join('')}</tbody></table></div>${m}</div>`}

function draw(){const sc=SCREENS[cur];
 $('#picker').innerHTML=['공통','교육생','운영팀'].map(g=>`<div class="grp"><b>${g}</b>${Object.entries(SCREENS).filter(([,v])=>v.g===g).map(([k,v])=>`<button class="pk" aria-pressed="${k===cur}" data-go="${k}">${v.n}</button>`).join('')}</div>`).join('');
 $('#changes').innerHTML=`<b>이 화면의 변경점</b><ul>${sc.changes.map(c=>`<li>${c}</li>`).join('')}</ul>`;
 $('#vp').style.display=sc.kind==='stage'?'flex':'none';
 document.querySelectorAll('#vp .pk').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.w===st.w)));
 if(sc.kind==='page'){$('#out').innerHTML=sc.render();return}
 const W=st.w,Hh=st.w===1440?790:970;
 $('#out').innerHTML=`<div class="stage-host" id="host"><span class="fit" id="fit"></span><div class="stage-clip" id="clip" style="width:${W}px;height:${Hh}px"><div class="app">${sc.render()}</div></div></div>`;
 fit(Hh)}
function fit(Hh){const host=$('#host'),clip=$('#clip');const k=Math.min(1,host.clientWidth/clip.offsetWidth);clip.style.transform=`scale(${k})`;host.style.height=Hh*k+'px';
 const main=clip.querySelector('.main');const over=main?main.scrollHeight-main.clientHeight:0;const f=$('#fit');const a=clip.querySelector('.app');
 f.className='fit '+(over<=1?'ok':'bad');f.textContent=over<=1?`한 화면에 들어감 · ${st.w}×${st.w===1440?900:1080}`:`스크롤 ${over}px 필요`}
let cur=(()=>{try{const h=location.hash.slice(1);return SCREENS[h]?h:'spec'}catch{return'spec'}})();
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-course],[data-back],[data-w],[data-open],[data-close],[data-rv],[data-tab],[data-lost]');if(!t)return;const d=t.dataset;
 if('go' in d){cur=d.go;st.m=null;try{history.replaceState(null,'','#'+cur)}catch{}}
 else if('course' in d){st.course=+d.course;st.m=null}else if('back' in d){st.course=null;st.m=null}
 else if('w' in d)st.w=+d.w;else if('open' in d)st.m=d.open;
 else if('close' in d){if(e.target.closest('.modal')&&!t.matches('button'))return;st.m=null}
 else if('rv' in d){e.stopPropagation();st.m=+d.rv}
 else if('tab' in d)st.tab=d.tab;else if('lost' in d)st.lost=!(st.lost??true);
 draw()});
window.addEventListener('resize',()=>{if(SCREENS[cur].kind==='stage')fit(st.w===1440?790:970)});
draw();
</script>
