# 개발용 compose: `docker compose up` 한 번으로 DB·백엔드·프론트를 띄운다.
# 먼저 `cp .env.example .env` 로 .env 를 만든다(비밀값은 .env 에만 둔다).
# 한 PC에서 여러 클론을 동시에 돌릴 때는 .env 의 COMPOSE_PROJECT_NAME 과 *_HOST_PORT 를 서로 다르게 지정한다.
name: ${COMPOSE_PROJECT_NAME:-gs42}

services:
  db:
    image: postgres:16
    env_file: .env
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      target: dev
    env_file: .env
    environment:
      # 컨테이너 안에서는 compose 서비스 이름과 컨테이너 포트로 DB에 연결한다.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # 프론트 dev 서버가 /api 를 프록시할 때 Host 가 backend:8000 으로 바뀌므로 서비스 이름을 허용한다.
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1},backend"
      # 브라우저가 접속하는 프론트 주소. CSRF 신뢰 origin·CORS 에 쓰이므로 FRONTEND_HOST_PORT 에서 계산해
      # 포트를 바꿔도 어긋나지 않게 한다(.env 의 FRONTEND_ORIGIN 은 compose 에서는 무시된다).
      FRONTEND_ORIGIN: "http://localhost:${FRONTEND_HOST_PORT:-5173}"
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app/backend
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-slim
    working_dir: /app/frontend
    # node_modules 는 컨테이너(리눅스) 전용 볼륨에 둔다. 호스트(macOS)의 것과 섞이지 않는다.
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app/frontend
      - frontend-node-modules:/app/frontend/node_modules
    depends_on:
      - backend

volumes:
  db-data:
  frontend-node-modules:
