name: CI

# PR 과 main 푸시에서 백엔드·프론트엔드를 검사한다. main 보호 규칙의 필수 체크는 job 이름 `backend`, `frontend`.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gs42
          POSTGRES_USER: gs42
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gs42 -d gs42"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI 전용 더미 값(비밀값 아님). 운영과 같은 DEBUG=false 로 돌려 설정 누락을 잡는다.
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: gs42
      POSTGRES_USER: gs42
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: DDD layer dependencies (import-linter)
        run: lint-imports
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (pytest)
        run: pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check (tsc)
        run: npm run typecheck
      - name: Lint (eslint)
        run: npm run lint
      - name: Tests (vitest)
        run: npm test
      - name: Build
        run: npm run build
