# 운영 구성 로컬 검증용 compose (AWS·도메인·외부 HTTPS 없이 http://localhost 에서만).
#   docker compose -p gs42-prod -f docker-compose.prod.yml up -d --build
# 개발용 docker-compose.yml 과 달리 소스를 마운트하지 않고, gunicorn + Caddy(정적 파일 + /api 프록시)로 실행한다.
# 먼저 .env 의 DJANGO_SECRET_KEY 를 실제 값으로 바꾼다(예시 값 change-me 로는 기동하지 않는다).
#
# 프로젝트 이름: .env 의 COMPOSE_PROJECT_NAME 은 파일의 name: 보다 우선하므로, 개발용(.env 값)과 섞이지 않게
# 운영 구성은 모든 명령에 `-p <이름>-prod` 를 명시한다(예: 기본 `-p gs42-prod`, 클론별로는 `-p gs42-b-prod`).
# 아래 name 은 -p 와 COMPOSE_PROJECT_NAME 이 모두 없을 때만 쓰이는 기본값이다.
name: gs42-prod

services:
  db:
    image: postgres:16
    env_file: .env
    volumes:
      - prod-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      target: prod
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # 운영 모드 고정: 모의 로그인이 꺼지고, 예시 시크릿 키는 거부된다.
      DJANGO_DEBUG: "false"
      # 로컬 http 검증이라 Secure 쿠키를 끈다. HTTPS 로 실제 배포할 때는 이 줄을 지워 기본값(Secure)을 쓴다.
      DJANGO_COOKIE_SECURE: "false"
      # 같은 origin 으로 접속하는 주소(CORS 허용 목록에만 쓰인다. CSRF 는 요청 Host 와 같은 Origin 이면 통과).
      FRONTEND_ORIGIN: "http://localhost:${PROD_HTTP_PORT:-80}"
    expose:
      - "8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      # 로컬 검증 전용이라 루프백에만 연다(Secure 쿠키를 끈 구성이므로 다른 PC에서 접속할 수 없어야 한다).
      - "127.0.0.1:${PROD_HTTP_PORT:-80}:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  prod-db-data:
