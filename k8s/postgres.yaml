apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: gs42-cluster
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels: {app: db}
  template:
    metadata:
      labels: {app: db}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom: {configMapKeyRef: {name: gs42-config, key: POSTGRES_DB}}
            - name: POSTGRES_USER
              valueFrom: {configMapKeyRef: {name: gs42-config, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: gs42-secret, key: POSTGRES_PASSWORD}}
            # 볼륨 루트에 lost+found 가 있을 수 있어 하위 디렉터리를 데이터 디렉터리로 쓴다.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            failureThreshold: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: gs42-cluster
spec:
  selector: {app: db}
  ports:
    - port: 5432
      targetPort: 5432
---
# DB 는 db-client=true 라벨이 붙은 파드(backend, 관리 Job)에서만 접속할 수 있다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-allow-backend-only
  namespace: gs42-cluster
spec:
  podSelector:
    matchLabels: {app: db}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {db-client: "true"}
      ports:
        - port: 5432
