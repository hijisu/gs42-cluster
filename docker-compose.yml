# 개발용 compose: `docker compose up` 한 번으로 DB·백엔드·프론트·리버스 프록시를 띄운다.
# 먼저 `cp .env.example .env` 로 .env 를 만든다(비밀값·포트는 .env 에만 둔다).
# 한 PC에서 여러 클론을 동시에 돌릴 때는 .env 의 COMPOSE_PROJECT_NAME 과 FRONTEND_HOST_PORT 를 서로 다르게 지정한다.
#
# 네트워크: 호스트로는 리버스 프록시(web) 포트 하나만 열린다.
#   edge = web·frontend·backend (프록시가 /api → backend, 그 외 → frontend)
#   data = backend·db (internal: DB 는 백엔드만 접속할 수 있고 호스트·다른 서비스에는 열리지 않는다)
name: ${COMPOSE_PROJECT_NAME:-gs42}

services:
  db:
    image: postgres:16
    env_file: .env
    # 컨테이너 안 포트도 .env 의 POSTGRES_PORT 를 따른다.
    command: ["postgres", "-p", "${POSTGRES_PORT:-5432}"]
    networks: [data]
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -p $${POSTGRES_PORT}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      target: dev
    env_file: .env
    environment:
      # 컨테이너 안에서는 compose 서비스 이름으로 DB 에 연결한다(포트는 .env 의 POSTGRES_PORT).
      POSTGRES_HOST: db
      # 프록시가 /api 를 넘길 때 Host 가 backend:<포트> 로 바뀌므로 서비스 이름을 허용한다.
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1},backend"
      # 브라우저가 접속하는 프론트 주소. CSRF 신뢰 origin·CORS 에 쓰이므로 .env 의 호스트·포트에서 계산한다
      # (.env 의 FRONTEND_ORIGIN 은 compose 에서는 무시된다).
      FRONTEND_ORIGIN: "http://${FRONTEND_PUBLIC_HOST:-localhost}:${FRONTEND_HOST_PORT:-5173}"
      # 42 가 로그인 후 돌려보내는 주소. 백엔드 포트는 호스트에 열지 않으므로 프록시(web)를 거치는 주소를 쓴다.
      FORTYTWO_REDIRECT_URI: "${FORTYTWO_REDIRECT_URI:-http://${FRONTEND_PUBLIC_HOST:-localhost}:${FRONTEND_HOST_PORT:-5173}/api/auth/callback}"
    networks: [edge, data]
    volumes:
      - ./backend:/app/backend
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-slim
    working_dir: /app/frontend
    # node_modules 는 컨테이너(리눅스) 전용 볼륨에 둔다. 호스트(macOS)의 것과 섞이지 않는다.
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port $${FRONTEND_PORT}"
    environment:
      FRONTEND_PORT: "${FRONTEND_PORT:-5173}"
      API_PROXY_TARGET: "http://backend:${BACKEND_PORT:-8000}"
    networks: [edge]
    volumes:
      - ./frontend:/app/frontend
      - frontend-node-modules:/app/frontend/node_modules
    depends_on:
      - backend

  # 리버스 프록시: 호스트에 여는 유일한 서비스 포트. /api → backend, 그 외 → frontend(Vite).
  # FRONTEND_BIND(.env)가 0.0.0.0 이면 같은 네트워크의 다른 기기에서 http://<이 PC의 IP>:<FRONTEND_HOST_PORT> 로 테스트할 수 있다.
  web:
    image: caddy:2-alpine
    environment:
      WEB_PORT: "${WEB_PORT:-80}"
      BACKEND_UPSTREAM: "backend:${BACKEND_PORT:-8000}"
      FRONTEND_UPSTREAM: "frontend:${FRONTEND_PORT:-5173}"
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_HOST_PORT:-5173}:${WEB_PORT:-80}"
    networks: [edge]
    volumes:
      - ./deploy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend

networks:
  edge:
  data:
    internal: true

volumes:
  db-data:
  frontend-node-modules:
